# Prototype draft for independent scientific review. NOT submitted to NIST.
# This contact address will be public if the file is submitted.
schema_version: "1.0"
name: Validity-qualified selective error risk at calibrated coverage
applied_definition: |
  Evaluate a fixed model on labeled observations under a predeclared loss L,
  unacceptable-error threshold epsilon, and uncertainty score s (smaller is
  safer). At threshold t, report acceptance coverage C(t) = P(s at most t) and
  conditional excessive-error risk R(t) = P(L(prediction, truth) > epsilon
  | s at most t). Select t using disjoint calibration scores; evaluate on held-out
  records, reporting actual test coverage, error counts, and scenario-specific
  risk. R is undefined if no predictions are accepted.

  Separately show test-set matched-coverage risk-coverage ranking as descriptive
  analysis, never a deployed threshold. Accompany both with event counts,
  calibration diagnostics where probabilities exist, cluster-aware intervals,
  distribution-shift breakdowns, and explicit numerical/model validity status.
  Validity flags describe available evidence; they do not certify reliability.
