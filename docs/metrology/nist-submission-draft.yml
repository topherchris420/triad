usage_details: |
  Supply a frozen predictor's scored records with disjoint calibration/test
  splits, independent sequence IDs, selected loss and error tolerance, and
  documented uncertainty-score direction. Run the Rust CLI to evaluate the
  fixed calibrated threshold and interpret risk alongside coverage, event
  counts and shift conditions. The repository includes a trained synthetic
  classification example and an exact-metric verification script.
  An external OpenML Electricity benchmark adds frozen logistic/forest models,
  temporal block sensitivity and independent NumPy metric checks. Combined
  applicability/confidence warnings did not improve degraded-window recall over
  a simpler covariate warning and increased false alarms. Identical simple
  warning gates reproduce TRIAD decisions; added predictive utility is unproven.
  Treat the numerical-evidence fields as input attestations, not as externally
  verified certificates. No confidence guarantee under new conditions follows.
known_failure_modes: |
  Calibration/test population shift can preserve coverage while collapsing
  accuracy. Rare error events, tied scores, empty acceptance, missing labels,
  score/probability confusion, unverifiable provenance, repeated observations,
  dependent spatial pools and unrepresentative validation samples can undermine
  interpretation. Separate sequence and spatial bootstrap intervals do not
  account for crossed clustering. Reported physical model credibility can fail
  despite solver convergence. TRIAD's 2D capacitive model still fails its
  numerical readiness gate; no hardware or 3D validation exists.
  Electricity's calendar chronology and upstream normalization/imputation are
  unresolved. Few dependent degraded windows cannot establish warning utility
  or concept drift. Computational cross-checks are not unrelated-team replication.
references:
