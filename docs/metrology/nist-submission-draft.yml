# Prototype draft for independent scientific review. NOT submitted to NIST.
# Milestone 7 recommendation: further scientific validation required before any
# submission (see docs/metrology/nist-readiness.md).
# This contact address will be public if the file is submitted.
schema_version: "1.0"
name: Selective excessive-error risk at calibration-fixed coverage
applied_definition: |
  For a fixed model, loss $L$, unacceptable-error threshold $\varepsilon$ and
  uncertainty score $s$ (smaller is safer), accept a prediction when
  $s \le t$:
  $$C(t)=P(s\le t),\qquad R(t)=P\big(L(\hat y,y)>\varepsilon \mid s\le t\big).$$
  $R(t)$ is undefined when nothing is accepted. Choose $t$ from calibration
  scores only, as the $\lceil nc\rceil$-th smallest calibration score for
  target coverage $c$ (ties accepted). Report actual held-out coverage, $R(t)$,
  and the accepted-error and acceptance counts. Report the retrospective
  risk-coverage curve and its area separately: it is descriptive and never a
  deployable threshold. For dependent data, report intervals from a
  dependence-aware method such as a moving-block bootstrap over time units.
submitter_organizations:
  - Vers3Dynamics
contact_email: ciao_chris@proton.me
ai_rmf_characteristics:
  - Valid & Reliable
ai_lifecycle_stages:
