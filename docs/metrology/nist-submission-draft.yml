model_specificity: model agnostic
domain_specificity: domain agnostic
usage_details: |
  Use when a predictor may abstain and the cost of an accepted unacceptable
  error matters. Supply frozen predictions, scores, labels and disjoint
  calibration/test splits. The Rust implementation evaluates classification and
  regression (regression via a normalised error with tolerance 1), together with
  event Brier/ECE and, for regression, normalised split-conformal coverage.
  Optional claim-relative evidence reports classify stated reliability claims
  as supported within scope, insufficient, contradicted or not applicable.
  In two pre-specified real-data studies (OpenML Electricity; UCI Bike
  Sharing), adding evidence qualification or validity-based warnings to
  selective risk did not improve reliability decisions; on Bike Sharing,
  evidence-qualified day gating cost slightly more than standard monitoring.
  Treat those reports as documentation aids, not as a reliability improvement.
known_failure_modes: |
  Coverage can be preserved while risk changes sharply under shift between
  calibration and use (Bike Sharing conformal coverage moved from 83% to 97% by
  month for one model). Calibration-quantile thresholds give no finite-sample
  risk guarantee. Rare error events, tied scores, empty acceptance, missing
  labels, dependent observations (hours, days, windows), score/probability
  confusion and unrepresentative calibration samples mislead interpretation.
  Absent time steps must not be treated as consecutive or as zero. Reducing
  risk by refusing more predictions is not an improvement unless coverage is
  matched or costed. Evidence classifications verify the consistency of
  supplied evidence, not its truth; misleading inputs defeated them.
references:
