name: Rust verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Locked Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build and run numerical and research-integrity tests
        run: cargo test --locked
      - name: Recompute read-only audits from frozen artifacts
        run: |
          cargo run --locked -- audit
          cargo run --locked -- information
      - name: Smoke-test portable experimental JSON contracts
        run: |
          cargo run --locked -- calibrate-abstention --input examples/abstention-calibration-demo.json > /tmp/triad-abstention.json
          cargo run --locked -- inspect-capture --input examples/synthetic-capture.json > /tmp/triad-capture.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("/tmp/triad-abstention.json").read_text())
          capture = json.loads(Path("/tmp/triad-capture.json").read_text())
          assert policy["status"] == "refused"
          assert policy["threshold"] is None
          assert capture["empty_reference_frames"] == 4
          assert capture["space"] == "synthetic2d"
          PY
      - name: Verify frozen baseline artifacts remain present
        run: |
          test -f results/validation.json
          test -f results/evaluation.json
          test -f results/summary.json
          test -f results/reproducibility-check.json
      - name: Verify audits did not alter frozen evidence
        run: |
          git diff --exit-code -- experiments/config.json results/cache results/dataset.json results/predictions.json results/evaluation.json results/summary.json results/validation.json results/reproducibility-check.json results/plots
