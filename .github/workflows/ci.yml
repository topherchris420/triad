name: Rust verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Locked Rust tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build and run numerical and research-integrity tests
        run: cargo test --locked
      - name: Lint Rust
        run: cargo clippy --locked --all-targets
      - name: Reproduce and independently verify the external Electricity benchmark
        run: |
          python -m pip install --disable-pip-version-check -r benchmarks/electricity/requirements.txt
          cargo run --release --locked -- metrology benchmark --help
          cargo run --release --locked -- metrology benchmark --input benchmarks/electricity/manifest.json --output results/ci-electricity
          cargo run --release --locked -- metrology validate --input results/ci-electricity/report.json
          cargo run --release --locked -- metrology validate --input results/benchmark-electricity/report.json
          python scripts/verify-benchmark.py results/ci-electricity/report.json
          python scripts/prepare-electricity.py --cache work/electricity-cache --output work/electricity-retrained
          python scripts/check-electricity-reproduction.py work/electricity-retrained
      - name: Reproduce and independently verify Milestone 7 (Bike Sharing and claim suite)
        run: |
          python -m pip install --disable-pip-version-check -r benchmarks/bike-sharing/requirements.txt
          cargo run --release --locked -- metrology evidence --help
          cargo run --release --locked -- metrology benchmark --input benchmarks/bike-sharing/manifest.json --output results/ci-bike-sharing
          cargo run --release --locked -- metrology validate --input results/ci-bike-sharing/report.json
          cargo run --release --locked -- metrology validate --input results/bike-sharing-v7/report.json
          cmp results/ci-bike-sharing/report.json results/bike-sharing-v7/report.json
          cargo run --release --locked -- metrology evidence-suite --input benchmarks/evidence-validation/suite.json --output results/ci-evidence-suite
          cargo run --release --locked -- metrology validate --input results/ci-evidence-suite/report.json
          cargo run --release --locked -- metrology validate --input results/evidence-suite-v7/report.json
          cargo run --release --locked -- metrology evidence --input examples/evidence-assessment.json --output results/ci-evidence-example.json
          cargo run --release --locked -- metrology validate --input results/evidence-example-v7.json
          python scripts/audit-bike-sharing.py --cache work/bike-cache --output work/bike-data-audit.json
          python -c "import json; a, b = (json.load(open(p)) for p in ('work/bike-data-audit.json', 'benchmarks/bike-sharing/data-audit.json')); [x.pop('source') for x in (a, b)]; assert a == b, 'data audit changed'"
          python scripts/verify-milestone7.py --bike results/ci-bike-sharing/report.json --suite results/ci-evidence-suite/report.json --evidence results/ci-evidence-example.json --data work/bike-cache
          python scripts/prepare-bike-sharing.py --cache work/bike-cache --output work/bike-retrained
          python scripts/check-bike-reproduction.py work/bike-retrained
      - name: Replay, regenerate and independently verify Milestone 8 (outcome-grounded evidence sufficiency)
        run: |
          python -m pip install --disable-pip-version-check -r benchmarks/evidence-outcomes/requirements.txt
          cargo run --release --locked -- metrology evidence-batch --help
          mkdir -p work/m8
          python -c "import gzip, shutil; shutil.copyfileobj(gzip.open('results/evidence-outcomes-v8/cases.json.gz'), open('work/m8/cases.json', 'wb'))"
          cp results/evidence-outcomes-v8/truth.json results/evidence-outcomes-v8/units.json work/m8/
          cargo run --release --locked -- metrology evidence-batch --input work/m8/cases.json --output work/m8/batch
          cmp work/m8/batch/classifications.json results/evidence-outcomes-v8/classifications.json
          cp work/m8/batch/classifications.json work/m8/
          python -m pytest -q benchmarks/evidence-outcomes/comparators/test_m8_comparators.py
          python benchmarks/evidence-outcomes/comparators/m8_comparators.py --input work/m8/cases.json --output work/m8/comparators.json
          python -c "import json; a, b = (json.load(open(p, encoding='utf-8')) for p in ('work/m8/comparators.json', 'results/evidence-outcomes-v8/comparators.json')); assert a == b, 'comparator replay differs'"
          python scripts/m8-score.py --truth work/m8/truth.json --triad work/m8/classifications.json --comparators work/m8/comparators.json --output work/m8/score
          cmp work/m8/score/report.json results/evidence-outcomes-v8/score/report.json
          mkdir -p work/m8-cache
          python -c "import json; [print(k, v['archive']) for k, v in json.load(open('benchmarks/evidence-outcomes/protocol.json'))['datasets'].items()]" > work/m8-archives.txt
          while read -r key url; do url="${url%$'\r'}"; curl -sSfL --retry 5 --retry-all-errors -o "work/m8-cache/$key.zip" "$url"; done < work/m8-archives.txt
          python scripts/m8-generate.py --cache work/m8-cache --output work/m8-regenerated
          python scripts/verify-milestone8.py --run work/m8 --regenerated work/m8-regenerated
      - name: Train and independently verify the generic demonstration
        run: |
          cargo run --locked -- metrology demo --output results/ci-metrology-demo
          cargo run --locked -- metrology validate --input results/ci-metrology-demo/report.json
          python scripts/verify-metrology.py results/ci-metrology-demo/report.json
      - name: Validate NIST prototype draft against pinned official schema
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'jsonschema==4.23.0'
          python scripts/validate-nist-draft.py
          python scripts/validate-nist-draft.py --self-test
      - name: Recompute read-only audits from frozen artifacts
        run: |
          cargo run --locked -- audit
          cargo run --locked -- information
      - name: Smoke-test portable experimental JSON contracts
        run: |
          mkdir -p results/ci-portable
          cargo run --locked -- calibrate-abstention --input examples/abstention-calibration-demo.json > results/ci-portable/abstention.json
          cargo run --locked -- inspect-capture --input examples/synthetic-capture.json > results/ci-portable/capture.json
          python scripts/verify-portable.py results/ci-portable/abstention.json results/ci-portable/capture.json
      - name: Verify frozen baseline artifacts remain present
        run: |
          test -f results/validation.json
          test -f results/evaluation.json
          test -f results/summary.json
          test -f results/reproducibility-check.json
      - name: Verify audits did not alter frozen evidence
        run: |
          git diff --exit-code -- experiments/config.json results/cache results/dataset.json results/predictions.json results/evaluation.json results/summary.json results/validation.json results/reproducibility-check.json results/plots
          git diff --exit-code -- results benchmarks experiments docs
