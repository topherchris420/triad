name: Archive TRIAD Milestone 3 research evidence

on:
  push:
    branches: ['research/milestone3-publish-20261011']
    paths:
      - '.github/workflows/publish-milestone3.yml'

permissions:
  actions: read
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download the original completed research artifact
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh run download 38154107523 \
            --repo "$GITHUB_REPOSITORY" \
            --name triad-milestone3-research-38154107523 \
            --dir .

      - name: Verify immutable experiment bundle and frozen baseline
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          root = Path("results/selective-v3")
          summary = json.loads((root / "summary.json").read_text())
          assert summary["experiment"] == "selective-v3"
          assert summary["protocol_sha256"] == sha("experiments/selective-v3.json")
          assert summary["supports_declared_primary_hypothesis"] is False
          assert summary["numerical_inspection_ready"] is False
          for name, expected in summary["artifact_sha256"].items():
              actual = sha(root / name)
              assert actual == expected, f"{name}: expected {expected}, got {actual}"
          numerical = json.loads(Path("results/numerical-audit-v3.json").read_text())
          assert numerical["likelihood_ready_for_claims"] is False
          geometry = json.loads(Path("results/geometry-screen-v1.json").read_text())
          assert geometry["status"] == "exploratory_surrogate_not_optimized_selective_risk"
          baseline_lines = Path("milestone3-logs/baseline-before.sha256").read_text().splitlines()
          for line in baseline_lines:
              expected, path = line.split(maxsplit=1)
              assert sha(path.lstrip("*")) == expected, f"Frozen baseline changed: {path}"
          print("Study artifacts, protocol, evaluation hashes and baseline hashes verified.")
          PY
          git diff --exit-code -- experiments/config.json results/cache results/dataset.json results/predictions.json results/evaluation.json results/summary.json results/validation.json results/reproducibility-check.json results/plots

      - name: Preserve exact original findings on the research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add milestone3-logs/baseline-before.sha256 \
            results/numerical-audit-v3.json \
            results/selective-v3/run.json \
            results/selective-v3/test-scores.json \
            results/selective-v3/evaluation.json \
            results/selective-v3/summary.json \
            results/geometry-screen-v1.json
          git commit -m "Archive verified Milestone 3 experimental results without changing baseline"
          git push origin HEAD:refs/heads/research/milestone3-publish-20261011
