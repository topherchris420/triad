schema_version: "1.0"
name: Selective-risk evaluation with explicit validity qualifications
applied_definition: |
  Measure excessive-loss frequency among accepted predictions and acceptance
  coverage, with a score threshold fixed on disjoint calibration data. Report
  retrospective ranking separately, alongside calibration diagnostics,
  cluster-sampling uncertainty, and numerical/model applicability limitations.
  This implementation provides descriptive metrics, not certified risk bounds.
submitter_organizations:
  - Vers3Dynamics
contact_email: "<PUBLIC PROFESSIONAL CONTACT REQUIRED>"
ai_rmf_characteristics:
  - Valid & Reliable
  - Accountable & Transparent
primary_tevv_application:
  - Tabular Data Benchmark Evaluation
ai_lifecycle_stages:
  - Build
  - Operate & Monitor
object_of_measurement:
  - model
model_specificity: model agnostic
domain_specificity: domain agnostic calculations; adequacy evidence is domain specific
modality:
  - structured data
  - physical
usage_details: |
  Compare fixed uncertainty-aware predictors under a declared loss and tolerance.
  Preserve numerical and statistical failure status when reporting descriptive
  results. No endorsement or validation by NIST is asserted.
known_failure_modes: |
  Rare failures, dependent sampling pools, missing labels, unverified evidence,
  and distribution shift can invalidate population interpretations. Capacitive
  physical confidence remains unresolved. Synthetic logistic transfer is only
  a demonstration that a non-capacitive trained model can be evaluated.
references:
